name: APK derle
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip -q VsmSpeedTool.zip -d out
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - run: cd out/VsmSpeedTool && gradle --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: VsmSpeedTool-debug-apk
          path: out/VsmSpeedTool/app/build/outputs/apk/debug/app-debug.apk
